<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>RSK Masters - Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,#eef7f2,#f7faf8);display:flex;align-items:center;justify-content:center;color:#1f2937}.login-box{width:390px;max-width:92%;background:#fff;border:1px solid #e3e9e5;border-radius:18px;padding:38px 36px;box-shadow:0 18px 50px rgba(24,65,48,.12)}.logo{width:58px;height:58px;margin:0 auto 17px;border-radius:16px;background:#176b4d;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px}h1{text-align:center;font-size:24px;margin:0;color:#173b2d}.subtitle{text-align:center;color:#7a8490;font-size:13px;margin:7px 0 28px}label{display:block;font-size:12px;font-weight:650;color:#46505b;margin:0 0 7px}.input{width:100%;height:46px;border:1px solid #d8dfdb;border-radius:9px;padding:0 13px;font-size:14px;outline:none;transition:.2s;margin-bottom:17px}.input:focus{border-color:#23845f;box-shadow:0 0 0 3px rgba(35,132,95,.10)}.password-wrap{position:relative}.password-wrap .input{padding-right:48px}.show{position:absolute;right:13px;top:13px;border:0;background:none;color:#6b7280;cursor:pointer;font-size:12px}button.login{width:100%;height:47px;border:0;border-radius:9px;background:#176b4d;color:#fff;font-size:14px;font-weight:700;cursor:pointer}button.login:hover{background:#125b40}.error{min-height:18px;text-align:center;color:#c0392b;font-size:12px;margin:10px 0 0}.footer{text-align:center;margin-top:25px;color:#a0a8b2;font-size:10px}</style></head><body><div class="login-box"><div class="logo">🌾</div><h1>RSK – Masters</h1><div class="subtitle">Master Data Management Portal</div><form id="loginForm"><label for="username">Username</label><input class="input" id="username" type="text" placeholder="Enter username" autocomplete="username" required><label for="password">Password</label><div class="password-wrap"><input class="input" id="password" type="password" placeholder="Enter password" autocomplete="current-password" required><button class="show" type="button" onclick="togglePassword()">Show</button></div><button class="login" type="submit">LOGIN</button><div class="error" id="error"></div></form><div class="footer">Government of Andhra Pradesh • Agriculture Department</div></div><script>const USERNAME="RSK",PASSWORD="Rsk@2026",DASHBOARD="RSK_Allocation_Dashboard.html";document.getElementById("loginForm").addEventListener("submit",function(e){e.preventDefault();const u=document.getElementById("username").value.trim(),p=document.getElementById("password").value,err=document.getElementById("error");if(u===USERNAME&&p===PASSWORD){err.textContent="";window.location.href=DASHBOARD}else err.textContent="Invalid username or password."});function togglePassword(){const f=document.getElementById("password"),b=document.querySelector(".show");if(f.type==="password"){f.type="text";b.textContent="Hide"}else{f.type="password";b.textContent="Show"}}</script></body></html>
